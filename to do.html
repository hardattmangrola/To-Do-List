<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@100&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
    body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    z-index: -1;
}

    body {
    background: #f9f9c5;
    font-family: 'Montserrat', sans-serif;
    background-image: url("todo1.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed; 
}

        .sticky-note {
            background: #ffeb99;
            color: #000;
            padding: 15px;
            width: 200px;
            height: 150px;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
            position: relative;
        }
        .sticky-note:hover {
            transform: scale(1.05);
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            border: none;
            background: none;
            font-size: 16px;
            color: red;
            cursor: pointer;
        }
    </style>
</head>
<body class="container py-5 text-center">
    <h1 class="mb-4" style="color: #fff;">To-Do List</h1>
    <button id="add-note" class="btn btn-primary mb-3">Add Note</button>
    <div class="d-flex flex-wrap justify-content-center" id="notes-container">
    </div>
    <script>
        $(document).ready(function () {
            function loadNotes() {
                $("#notes-container").empty();
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    let noteData = JSON.parse(localStorage.getItem(key));
                    $("#notes-container").append(createNoteElement(key, noteData.title, noteData.content));
                }
            }

            function createNoteElement(id, title, content) {
                return `<div class="sticky-note m-2" id="${id}">
                            <button class="delete-btn">&times;</button>
                            <h5 contenteditable="true">${title}</h5>
                            <p contenteditable="true">${content}</p>
                        </div>`;
            }

            $("#add-note").click(function () {
                let noteId = "note_" + new Date().getTime();
                let newNote = createNoteElement(noteId, "New Title", "New Content");
                $("#notes-container").append(newNote);
                localStorage.setItem(noteId, JSON.stringify({ title: "New Title", content: "New Content" }));
            });

            $(document).on("click", ".delete-btn", function () {
                let noteDiv = $(this).parent();
                let noteId = noteDiv.attr("id");
                localStorage.removeItem(noteId);
                noteDiv.remove();
            });

            $(document).on("keyup", ".sticky-note", function () {
                let noteId = $(this).attr("id");
                let title = $(this).find("h5").text();
                let content = $(this).find("p").text();
                localStorage.setItem(noteId, JSON.stringify({ title: title, content: content }));
            });

            loadNotes();
        });
    </script>
</body>
</html>
